[project]
name = "hugo-rapm"
version = "0.1.0"
description = "Why Hugo Gonzalez's RAPM disagrees with DARKO and LEBRON"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "pyyaml>=6",
    "requests>=2.31",
    "matplotlib>=3.8",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.4", "ipykernel>=6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
